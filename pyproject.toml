[project]
name = "redocx"
version = "0.0.1"
description = "A document markup language that compiles to native, fully formatted Word (.docx) documents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "redocx contributors" }]
requires-python = ">=3.12"
dependencies = [
    "citeproc-py>=0.6",
    "lxml>=5.3",
    "pillow>=10.4",
    "pygments>=2.18",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Text Processing :: Markup",
    "Typing :: Typed",
]

[project.scripts]
redocx = "redocx.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "hypothesis>=6.100",
    "pytest>=8.3",
    "python-docx>=1.1",
    "ruff>=0.12",
    "types-lxml>=2025.3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "examples"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N"]
ignore = ["SIM905"]  # word lists written as "a b c".split() read better

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # test data tables read better unwrapped
"src/redocx/lower/typography.py" = ["RUF001"]  # typographic characters are the point
"src/redocx/math/**" = ["RUF001"]  # math symbols are the point
"tests/math/**" = ["RUF001", "E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
pythonpath = ["."]
markers = [
    "validator: needs the .NET OOXML validator (tools/ooxml-validate); skipped when dotnet is unavailable",
]
